<!DOCTYPE html>
<html>
<head>
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="simon-game">
        <h2>Simon Says</h2>
        <div class="board">
            <div class="panel green" data-color="green"></div>
            <div class="panel red" data-color="red"></div>
            <div class="panel yellow" data-color="yellow"></div>
            <div class="panel blue" data-color="blue"></div>
        </div>
    </div>
</body>
</html>
