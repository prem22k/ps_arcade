<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS_ARCADE // Cyber Grid Serpentine</title>
    <link rel="stylesheet" href="style.css?v=3.0.1">
</head>
<body class="snake-body">
    <div class="ambient-glow glow-cyan"></div>
    <div class="ambient-glow glow-pink"></div>
    <div class="grid-overlay"></div>
    
    <div class="cabinet-container">
        <header class="game-header">
            <div class="header-top-row">
                <a href="../../index.html" class="back-btn">&lt;&lt; [PORTAL]</a>
                <div class="header-tags">
                    <span class="tag cyan-tag">V5.0.0-SERPENT</span>
                    <span class="tag pink-tag">PREMIUM</span>
                </div>
            </div>
            <div class="header-main-row">
                <h1 class="game-title">CYBER_GRID_SERPENTINE</h1>
            </div>
        </header>

        <main class="display-arena">
            <!-- HUD -->
            <div class="hud-bar">
                <div class="hud-item">
                    <span class="label">SYS:</span>
                    <span id="system-status" class="value cyan-text">SYS_OK</span>
                </div>
                <div class="hud-item">
                    <span class="label">QUEUE:</span>
                    <span id="score-display" class="value cyan-text">0</span>
                </div>
                <div class="hud-item">
                    <span class="label">MAX_RECORD:</span>
                    <span id="record-display" class="value yellow-text">0</span>
                </div>
            </div>

            <!-- Viewport Canvas -->
            <div class="matrix-container">
                <div class="canvas-wrapper">
                    <canvas id="snake-canvas" width="400" height="400"></canvas>
                </div>
            </div>

            <!-- Controls bar -->
            <div class="controls-bar">
                <button id="restart-btn" class="menu-btn cyan-btn">START_SERPENT</button>
            </div>

            <!-- Virtual Touch Controller for Mobile -->
            <div class="mobile-controller">
                <div class="control-selector">
                    <span class="label">MOBILE_INPUT:</span>
                    <button id="ctrl-mode-btn" class="menu-btn cyan-btn" style="padding: 4px 12px; font-size: 0.8rem;">[MODE: D-PAD]</button>
                </div>
                
                <div class="dpad" id="mobile-dpad">
                    <button class="ctrl-btn" id="ctrl-up">▲</button>
                    <button class="ctrl-btn" id="ctrl-left">◀</button>
                    <button class="ctrl-btn" id="ctrl-right">▶</button>
                    <button class="ctrl-btn" id="ctrl-down">▼</button>
                </div>

                <div class="swipe-hint" id="mobile-swipe-hint" style="display: none;">
                    <p class="sys-msg">// SWIPE ON THE CANVAS TO STEER SERPENT</p>
                </div>
            </div>

            <!-- Terminal Screen logs -->
            <div class="terminal-display">
                <div class="crt-screen log-screen">
                    <span class="label-hint">NEXUS SECURE TERMINAL DATA FEED</span>
                    <div id="terminal-logs" class="terminal-logs">
                        <!-- Scrolling cyber logs -->
                    </div>
                </div>
            </div>
            
            <footer class="hud-footer">
                <p id="sys-meta" class="sys-msg">GRID SYNC INTEGRATION ACTIVE // SECURE QUANTUM VAULT STANDARDS</p>
            </footer>
        </main>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
