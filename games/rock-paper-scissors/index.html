<!-- Step 4: feat: declare interactive strategic selection decks in rps structure -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS_ARCADE // Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css?v=3.0.1">
</head>
<body class="rps-body">
    <div class="grid-overlay"></div>
    <div class="cabinet-container">
        <header class="game-header">
            <a href="../../index.html" class="back-btn">&lt;&lt; [PORTAL]</a>
            <h1 class="game-title">CYBER_RPS</h1>
            <div class="header-tags">
                <span class="tag cyan-tag">V3.0.0-PROD</span>
                <span class="tag pink-tag">PREMIUM</span>
            </div>
        </header>

        <main class="display-arena">
            <div class="hud-bar">
                <div class="hud-item">
                    <span class="label">PILOT:</span>
                    <span id="pilot-name" class="value cyan-text">PILOT_D01</span>
                </div>
                <div class="hud-item">
                    <span class="label">STREAK:</span>
                    <span id="live-streak" class="value pink-text">0</span>
                </div>
                <div class="hud-item">
                    <span class="label">SCORE:</span>
                    <span id="live-score" class="value yellow-text">0</span>
                </div>
                <div class="hud-item">
                    <span class="label">RECORD:</span>
                    <span id="high-score" class="value green-text">0</span>
                </div>
            </div>

            <!-- Choice Visualizer Arena -->
            <div class="battleground">
                <div class="fighter-zone" id="player-zone">
                    <span class="zone-label">[PILOT_DECK]</span>
                    <div class="choice-visualizer" id="player-visualizer">READY</div>
                </div>
                
                <div class="vs-divider">VS</div>

                <div class="fighter-zone" id="cpu-zone">
                    <span class="zone-label">[CPU_DECK]</span>
                    <div class="choice-visualizer" id="cpu-visualizer">READY</div>
                </div>
            </div>

            <!-- Interactive Selection Deck -->
            <div class="deck-container">
                <button class="deck-card rock-card" onclick="selectCard('rock')">
                    <div class="card-inner">
                        <span class="card-symbol">✊</span>
                        <span class="card-name">ROCK</span>
                    </div>
                </button>
                <button class="deck-card paper-card" onclick="selectCard('paper')">
                    <div class="card-inner">
                        <span class="card-symbol">📄</span>
                        <span class="card-name">PAPER</span>
                    </div>
                </button>
                <button class="deck-card scissors-card" onclick="selectCard('scissors')">
                    <div class="card-inner">
                        <span class="card-symbol">✂️</span>
                        <span class="card-name">SCISSORS</span>
                    </div>
                </button>
            </div>

            <div class="controls-bar">
                <button id="resetBtn" class="menu-btn pink-btn" onclick="resetGame()">[REBOOT_SCORES]</button>
            </div>
            
            <footer class="hud-footer">
                <p id="sys-status" class="sys-msg">[SYS_STATUS: ONLINE] // CHOOSE YOUR STRATEGY MODULE TO ENGAGE</p>
            </footer>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
