<!-- Step 3: style: develop glassmorphic display zones and arena sections in rps -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS_ARCADE // Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="rps-body">
    <div class="grid-overlay"></div>
    <div class="cabinet-container">
        <header class="game-header">
            <a href="../../index.html" class="back-btn">&lt;&lt; [PORTAL]</a>
            <h1 class="game-title">CYBER_RPS</h1>
            <div class="header-tags">
                <span class="tag cyan-tag">V3.0.0-PROD</span>
                <span class="tag pink-tag">PREMIUM</span>
            </div>
        </header>
        <main class="display-arena">
            <div class="hud-bar">
                <div class="hud-item">
                    <span class="label">PILOT:</span>
                    <span id="pilot-name" class="value cyan-text">PILOT_D01</span>
                </div>
                <div class="hud-item">
                    <span class="label">STREAK:</span>
                    <span id="live-streak" class="value pink-text">0</span>
                </div>
                <div class="hud-item">
                    <span class="label">SCORE:</span>
                    <span id="live-score" class="value yellow-text">0</span>
                </div>
                <div class="hud-item">
                    <span class="label">RECORD:</span>
                    <span id="high-score" class="value green-text">0</span>
                </div>
            </div>
            <div class="battleground">
                <div class="fighter-zone" id="player-zone">
                    <span class="zone-label">[PILOT_DECK]</span>
                    <div class="choice-visualizer" id="player-visualizer">READY</div>
                </div>
                <div class="vs-divider">VS</div>
                <div class="fighter-zone" id="cpu-zone">
                    <span class="zone-label">[CPU_DECK]</span>
                    <div class="choice-visualizer" id="cpu-visualizer">READY</div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
