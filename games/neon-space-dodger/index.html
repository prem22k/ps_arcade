<!-- Step 4: style: develop glassmorphic viewport wrappers and neon borders for dodger -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS_ARCADE // Neon Space Dodger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dodger-body">
    <div class="grid-overlay"></div>
    <div class="cabinet-container">
        <header class="game-header">
            <a href="../../index.html" class="back-btn">&lt;&lt; [PORTAL]</a>
            <h1 class="game-title">NEON_SPACE_DODGER</h1>
            <div class="header-tags">
                <span class="tag cyan-tag">V1.0.0-PROD</span>
                <span class="tag pink-tag">CROWN_JEWEL</span>
            </div>
        </header>
        <main class="display-arena">
            <div class="hud-bar">
                <div class="hud-item">
                    <span class="label">SCORE:</span>
                    <span id="live-score" class="value cyan-text">0000</span>
                </div>
                <div class="hud-item">
                    <span class="label">SHIELD:</span>
                    <div class="shield-container">
                        <div id="shield-bar" class="shield-fill" style="width: 100%"></div>
                    </div>
                    <span id="shield-text" class="value green-text">100%</span>
                </div>
                <div class="hud-item">
                    <span class="label">SPEED_VEC:</span>
                    <span id="vector-reading" class="value yellow-text">0.0 px/s</span>
                </div>
                <div class="hud-item">
                    <span class="label">RECORD:</span>
                    <span id="high-score" class="value pink-text">0000</span>
                </div>
            </div>
            <div class="canvas-wrapper">
                <canvas id="game-canvas" width="800" height="500"></canvas>
            </div>
        </main>
    </div>
</body>
</html>
